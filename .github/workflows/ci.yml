name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build; 24.04 does.
          - os: ubuntu-24.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: command -v jq || brew install jq
      - name: Unit, hook and repo-consistency tests
        run: python3 -m unittest discover -s tests -v

  checks:
    name: Lint, plugin validation and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Local checks
        run: tools/ci-local --skip-tests
      - name: Check release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: tools/ci-local --version-only --tag "$TAG"

  release:
    needs: [tests, checks]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          version=$(jq -r .version .claude-plugin/plugin.json)
          python3 - "$version" > release-notes.md <<'PY'
          import re, sys
          from pathlib import Path
          version = sys.argv[1]
          text = Path('CHANGELOG.md').read_text()
          match = re.search(r'^## ' + re.escape(version) + r'(?: |$)[^\n]*\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          if not match:
              sys.exit('::error::Missing changelog section')
          print(match.group(1).strip())
          PY
          gh release create "$TAG" --verify-tag --title "Agent Kaizen $version" --notes-file release-notes.md
